worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;
    sendfile      on;
    server_tokens off;

    # Applications reference resumes by pointer, but the relay upload path (Telegram targets)
    # streams file bytes through the API.
    client_max_body_size 50m;

    log_format rolewire '$remote_addr - $status "$request" $request_time';
    access_log /var/log/nginx/access.log rolewire;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The API derives the applicant IP hash from the left-most entry (app/routers/deps.py).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    upstream api {
        server api:8000;
    }

    # upstream admin {
    #     server admin:3000;
    # }

    server {
        listen 80;
        server_name _;

        # In production this server block listens on 443 with TLS certs mounted, and port 80
        # only issues a redirect.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /health {
            proxy_pass http://api;
            access_log off;
        }

        # Public, unauthenticated endpoints — embedded on arbitrary tenant career pages.
        location /v1/public/ {
            proxy_pass http://api;
        }

        location /v1/admin/ {
            proxy_pass http://api;
        }

        # Provider webhooks: authenticated by signature inside the app (§12).
        location /v1/webhooks/ {
            proxy_pass http://api;
        }

        # Admin panel (Next.js), once ./admin is implemented.
        # location / {
        #     proxy_pass http://admin;
        # }

        location / {
            default_type application/json;
            return 404 '{"detail":"not found"}';
        }
    }
}
